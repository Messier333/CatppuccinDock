version: 2
updates:
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-compatible:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-compatible:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # The root pip updater also discovers backend manifests. Keep runtime
    # dependencies in the /backend updater to avoid duplicate PRs.
    allow:
      - dependency-name: pip-audit
      - dependency-name: pip-tools
      - dependency-name: ruff
    groups:
      development-tools:
        update-types: [minor, patch]
