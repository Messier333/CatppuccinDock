name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  configuration:
    name: Source and deployment configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Check publishable source
        run: python scripts/check_publish.py

      - name: Test publishing safeguards
        run: python -m unittest discover -s scripts/tests -v

      - name: Validate registry deployment configuration
        env:
          POSTGRES_PASSWORD: ci-placeholder
          ADMIN_SETUP_CODE: ci-placeholder
          AUTH_ENCRYPTION_KEY: ci-placeholder
          S3_ACCESS_KEY_ID: ci-placeholder
          S3_SECRET_ACCESS_KEY: ci-placeholder
          GARAGE_RPC_SECRET: ci-placeholder
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file /dev/null config --quiet
          docker compose --env-file .env.example -f docker-compose.yml -f compose.build.yml config --quiet

  frontend:
    name: Frontend tests and image build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Verify frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=image-frontend
          cache-to: type=gha,mode=max,scope=image-frontend

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build isolated test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: catppuccindock-backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Run backend tests with a disposable SQLite database
        run: docker run --rm --network none catppuccindock-backend-test:ci
