name: CI/CD

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Code quality
    uses: ./.github/workflows/quality.yml

  security:
    name: Dependency and security analysis
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/security.yml

  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  browser:
    name: Browser tests
    uses: ./.github/workflows/browser-tests.yml

  release-tag:
    name: Validate release tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source and main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify version and membership in main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check_release_tag.py --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"

  publish:
    name: Publish images
    needs: [quality, security, checks, browser, release-tag]
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml

  verify-release:
    name: Verify release images
    needs: [publish]
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/release-verification.yml

  release:
    name: Create release
    needs: [verify-release]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
