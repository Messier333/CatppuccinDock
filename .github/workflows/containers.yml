name: CI/CD

on:
  push:
    branches: [main, dev]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' }}

jobs:
  quality:
    name: Code quality
    uses: ./.github/workflows/quality.yml

  security:
    name: Dependency and security analysis
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/security.yml

  checks:
    name: Checks
    needs: [quality, security]
    uses: ./.github/workflows/checks.yml

  browser:
    name: Browser tests
    needs: [quality, security]
    uses: ./.github/workflows/browser-tests.yml

  version:
    name: Prepare release version
    needs: [checks, browser]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    uses: ./.github/workflows/version.yml

  publish:
    name: Publish images
    needs: [version]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml
    with:
      release_tag: ${{ needs.version.outputs.tag }}

  release:
    name: Create release
    needs: [version, publish]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.version.outputs.tag }}
