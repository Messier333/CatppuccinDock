name: Publish container images

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.component }}
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, backend]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare lowercase image name
        id: image
        env:
          COMPONENT: ${{ matrix.component }}
        run: printf 'name=ghcr.io/%s-%s\n' "${GITHUB_REPOSITORY,,}" "$COMPONENT" >> "$GITHUB_OUTPUT"

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Prepare BuildKit image
        id: buildkit
        timeout-minutes: 4
        run: sh scripts/prepare_buildkit.sh

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ steps.buildkit.outputs.image }}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=auto
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.component }}
          pull: true
          platforms: linux/amd64,linux/arm64
          push: true
          # Keep release/latest aliases unchanged until the exact image passes verification.
          tags: ${{ steps.image.outputs.name }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=image-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.component }}

      - name: Record published image digest
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 scripts/release_images.py record \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --component "$COMPONENT" --image "$IMAGE_NAME" --digest "$IMAGE_DIGEST" \
            --directory "$RUNNER_TEMP/release-images"

      - name: Save published image identity for release checks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-${{ matrix.component }}
          path: ${{ runner.temp }}/release-images/${{ matrix.component }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
