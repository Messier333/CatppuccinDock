name: Dependency and security analysis

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * 1'

permissions:
  contents: read

jobs:
  python-dependencies:
    name: Python lock and vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-security.txt
      - name: Install security tools
        run: python -m pip install -r requirements-security.txt
      - name: Verify the dependency lock is current
        working-directory: backend
        env:
          CUSTOM_COMPILE_COMMAND: python -m piptools compile --generate-hashes --strip-extras --output-file=backend/requirements.txt backend/requirements.in
        run: |
          python -m piptools compile --quiet --generate-hashes --strip-extras --allow-unsafe --output-file requirements.txt requirements.in
          git diff --exit-code -- requirements.txt
      - name: Audit locked Python dependencies
        run: python -m pip_audit --require-hashes -r backend/requirements.txt

  npm-dependencies:
    name: npm vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit npm lockfile including development tools
        working-directory: frontend
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/config.yml
      - name: Analyze and upload findings
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:${{ matrix.language }}
          output: sarif
      - name: Block high-severity security findings
        run: python3 scripts/check_sarif.py sarif
