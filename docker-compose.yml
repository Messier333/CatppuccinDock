services:
  garage:
    image: dxflrs/garage:v2.4.1
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      RUST_LOG: warn
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET in .env or the process environment}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env or the process environment}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env or the process environment}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-catppuccindock}
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    configs:
      - source: garage_config
        target: /etc/garage.toml
    expose:
      - "3900"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - data
    restart: unless-stopped

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-catppuccindock}
      POSTGRES_USER: ${POSTGRES_USER:-catppuccindock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the process environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data
    restart: unless-stopped

  backend:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/overture-1928/catppuccindock}-backend:${IMAGE_TAG:-latest}
    environment:
      POSTGRES_HOST: database
      ADMIN_SETUP_CODE: ${ADMIN_SETUP_CODE:?Set ADMIN_SETUP_CODE in .env or the process environment}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:?Set AUTH_ENCRYPTION_KEY in .env or the process environment}
      AUTH_LOG_PATH: /var/log/catppuccindock/auth.log
      MEDIA_STORAGE_BACKEND: ${MEDIA_STORAGE_BACKEND:-s3}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://garage:3900}
      S3_REGION: ${S3_REGION:-garage}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env or the process environment}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env or the process environment}
      S3_BUCKET: ${S3_BUCKET:-catppuccindock}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-catppuccindock}
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-catppuccindock}
      POSTGRES_USER: ${POSTGRES_USER:-catppuccindock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the process environment}
    volumes:
      - auth_logs:/var/log/catppuccindock
    read_only: true
    tmpfs:
      - /tmp:size=768m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    init: true
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      garage:
        condition: service_healthy
      database:
        condition: service_healthy
    networks:
      - app
      - data
    restart: unless-stopped

  frontend:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/overture-1928/catppuccindock}-frontend:${IMAGE_TAG:-latest}
    ports:
      - "${PORTAL_PORT:-8090}:8080"
    volumes:
      - ./deploy/nginx/trusted-proxies:/etc/nginx/trusted-proxies:ro
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
  garage_meta:
  garage_data:
  auth_logs:

networks:
  # Only the reverse proxy and API share the externally connected network.
  app:
  # PostgreSQL and Garage cannot reach, or be reached from, external networks.
  data:
    internal: true

# Inline configuration keeps image deployments independent of source files.
configs:
  garage_config:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      replication_factor = 1
      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "127.0.0.1:3901"

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "[::]:3900"
