map "$request_method:$uri" $auth_limit_key {
    default "";
    ~^POST:/api/auth/(?:login|mfa|setup)$ $binary_remote_addr;
}

map "$request_method:$uri" $media_limit_key {
    default "";
    ~^POST:/api/(?:backgrounds|uploaded-icons)(?:/|$) $binary_remote_addr;
}

limit_req_zone $auth_limit_key zone=auth_requests:10m rate=10r/m;
limit_req_zone $media_limit_key zone=media_requests:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=client_connections:10m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    include /etc/nginx/trusted-proxies/*.conf;
    include /etc/nginx/security-headers.conf;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_hide_header Server;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-Permitted-Cross-Domain-Policies;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn client_connections 20;

    location ~ ^/api/auth/(?:login|mfa|setup)$ {
        limit_req zone=auth_requests burst=5 nodelay;
        client_max_body_size 64k;
        proxy_request_buffering off;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    location ~* \.(?:woff2?|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    location ~ ^/api/backups/(?:export|import-preview|import)$ {
        client_max_body_size 385m;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/backgrounds(?:/|$) {
        limit_req zone=media_requests burst=3 nodelay;
        client_max_body_size 100m;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/uploaded-icons(?:/|$) {
        limit_req zone=media_requests burst=3 nodelay;
        client_max_body_size 5m;
        proxy_request_buffering off;
        proxy_read_timeout 30s;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        client_max_body_size 10m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
        return 302 admin/;
    }

    location = /login {
        return 302 login/;
    }

    location = /admin/index.html {
        rewrite ^ /index.html last;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        include /etc/nginx/security-headers.conf;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    location ^~ /admin/assets/ {
        alias /usr/share/nginx/html/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    location ^~ /login/assets/ {
        alias /usr/share/nginx/html/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    location /admin/ {
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
